name: Compilar MHEditor.exe
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tools/build_exe.py
      - run: Compress-Archive -Path MHEditor -DestinationPath MHEditor.zip
        shell: powershell
      - uses: actions/upload-artifact@v4
        with:
          name: MHEditor
          path: MHEditor.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: MHEditor.zip
          body: |
            Mejorado el agregado de área a una región mediante GeoJSON.

            Improved adding area to a region using GeoJSON.
